<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Fyrverkeri – hurtigoppslag</title>
  <style>
    :root {
      --bg: #0b1020;
      --panel: rgba(255,255,255,0.06);
      --text: rgba(255,255,255,0.92);
      --muted: rgba(255,255,255,0.62);
      --border: rgba(255,255,255,0.12);
      --shadow: 0 16px 40px rgba(0,0,0,0.35);
      --radius: 18px;
      --font: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--font);
      color: var(--text);
      background:
        radial-gradient(1100px 520px at 15% 0%, rgba(77, 99, 255, 0.35), transparent 60%),
        radial-gradient(900px 520px at 100% 20%, rgba(255, 111, 77, 0.30), transparent 55%),
        var(--bg);
      min-height: 100vh;
    }
    .app { max-width: 1280px; margin: 0 auto; padding: 16px 14px 22px; }
    header {
      position: sticky; top: 0; z-index: 30;
      padding: 12px 0 12px;
      background: linear-gradient(to bottom, rgba(11,16,32,0.92), rgba(11,16,32,0.55));
      backdrop-filter: blur(10px);
    }
    .headrow { display:flex; align-items:flex-end; justify-content: space-between; gap: 12px; }
    h1 { margin: 0; font-size: 20px; line-height: 1.15; letter-spacing: 0.2px; }
    .sub { margin-top: 6px; font-size: 12px; color: var(--muted); }
    .chip {
      display:inline-flex; align-items:center; gap:8px;
      padding: 8px 10px; border-radius: 999px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.04);
      color: var(--muted); font-size: 12px; white-space: nowrap;
    }

    .layout { display: grid; grid-template-columns: 420px 1fr; gap: 14px; margin-top: 12px; }
    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .panelHeader {
      padding: 12px 12px 10px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      background: rgba(255,255,255,0.03);
    }
    .panelHeader .title { font-size: 13px; color: var(--muted); margin-bottom: 8px; }
    .searchRow { display:flex; gap: 8px; align-items:center; }
    input[type="text"], select {
      width: 100%;
      padding: 12px 12px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: rgba(10,14,26,0.55);
      color: var(--text);
      outline: none;
      min-height: 44px;
    }
    input[type="text"]::placeholder { color: rgba(255,255,255,0.35); }

    .list { max-height: calc(100vh - 220px); overflow: auto; -webkit-overflow-scrolling: touch; }
    .item {
      padding: 12px 12px;
      border-bottom: 1px solid rgba(255,255,255,0.07);
      display:flex; justify-content: space-between; gap: 12px;
      cursor: pointer; user-select: none;
    }
    .item:hover { background: rgba(255,255,255,0.05); }
    .item.active { background: rgba(255,255,255,0.08); }

    .itemLeft { min-width: 0; }
    .itemName {
      font-weight: 650; line-height: 1.2; margin-bottom: 6px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .itemMeta { display:flex; gap: 10px; align-items:center; color: var(--muted); font-size: 12px; flex-wrap: wrap; }

    .pill {
      display:inline-flex; align-items:center; gap: 7px;
      padding: 6px 8px;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 999px;
      background: rgba(255,255,255,0.04);
      white-space: nowrap;
    }
    .dot {
      width: 10px; height: 10px; border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.18);
      display:inline-block;
    }
    .m-high .dot { background: rgba(45, 212, 191, 0.95); }
    .m-mid  .dot { background: rgba(250, 204, 21, 0.95); }
    .m-low  .dot { background: rgba(251, 113, 133, 0.95); }

    .priceRight {
      text-align: right;
      font-variant-numeric: tabular-nums;
      flex: 0 0 auto;
      color: var(--text);
      font-weight: 650;
    }
    .priceRight .muted {
      display:block;
      font-size: 12px;
      color: var(--muted);
      font-weight: 500;
      margin-top: 4px;
    }

    .detail { padding: 14px; }
    .detailTop {
      display:flex; justify-content: space-between; gap: 12px; align-items:flex-start;
      padding-bottom: 12px; border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .detailName { font-size: 18px; font-weight: 750; line-height: 1.2; margin: 0 0 6px 0; }
    .detailHint { color: var(--muted); font-size: 12px; }

    .kpis { display:grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 12px; }
    .kpi {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: 16px;
      padding: 12px;
    }
    .kpi .k { color: var(--muted); font-size: 12px; margin-bottom: 6px; }
    .kpi .v { font-weight: 800; font-size: 16px; font-variant-numeric: tabular-nums; }

    .grid2 { display:grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
    .row {
      display:flex; justify-content: space-between; gap: 10px;
      padding: 10px 12px;
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: 14px;
      background: rgba(255,255,255,0.03);
    }
    .row .k { color: var(--muted); font-size: 12px; line-height: 1.25; }
    .row .v { font-variant-numeric: tabular-nums; font-weight: 700; text-align:right; }

    .actions { display:flex; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
    .btn {
      border: 1px solid rgba(255,255,255,0.14);
      background: rgba(255,255,255,0.04);
      color: var(--text);
      padding: 11px 12px;
      border-radius: 14px;
      cursor: pointer;
      font-size: 12px;
      min-height: 44px;
    }
    .btn:hover { background: rgba(255,255,255,0.08); }

    .mobileBar { display:none; gap: 8px; align-items:center; margin-top: 10px; }
    .mobileBack {
      display:none; align-items:center; gap: 8px;
      border: 1px solid rgba(255,255,255,0.14);
      background: rgba(255,255,255,0.04);
      color: var(--text);
      padding: 11px 12px;
      border-radius: 14px;
      cursor: pointer;
      min-height: 44px;
      font-size: 12px;
      white-space: nowrap;
    }

    .sheet { position: fixed; inset: 0; display:none; z-index: 60; }
    .sheetBackdrop { position:absolute; inset:0; background: rgba(0,0,0,0.55); }
    .sheetPanel {
      position:absolute; left: 0; right: 0; bottom: 0;
      border-radius: 22px 22px 0 0;
      background: rgba(11,16,32,0.96);
      border: 1px solid rgba(255,255,255,0.12);
      box-shadow: 0 -20px 60px rgba(0,0,0,0.55);
      max-height: 88vh;
      overflow:auto;
      -webkit-overflow-scrolling: touch;
      padding: 10px 12px 16px;
    }
    .grab { width: 46px; height: 5px; border-radius: 999px; background: rgba(255,255,255,0.20); margin: 6px auto 10px; }

    @media (max-width: 980px) {
      .layout { grid-template-columns: 360px 1fr; }
      .kpis { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 740px) {
      .layout { grid-template-columns: 1fr; }
      .list { max-height: none; }
      .detailPanelDesktop { display:none; }
      .mobileBar { display:flex; }
      .chip { display:none; }
    }
  </style>
</head>

    <header>

        <div>

          <div class="sub">Trykk på et produkt for å se alle priser og detaljer.</div>
        </div>
        <div class="chip" id="statusChip">–</div>
      </div>

      <div class="mobileBar">

        <div class="chip" id="mobileCount">–</div>
      </div>

              <option value="high">Høy ≥60%</option>
              <option value="mid">40–59.9%</option>
              <option value="low">Lav &lt;40%</option>

          </div>
        </div>
        <div class="list" id="list"></div>
      </section>

      <section class="panel detailPanelDesktop" aria-label="Detaljer">
        <div class="detail" id="detailDesktop">
          <div class="detailTop">
            <div>
              <div class="detailName">Velg et produkt</div>
              <div class="detailHint">Klikk i listen for å se priser, margin, faktor osv.</div>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <div class="sheet" id="sheet">
    <div class="sheetBackdrop" id="sheetBackdrop"></div>
    <div class="sheetPanel" role="dialog" aria-modal="true">
      <div class="grab"></div>
      <div id="detailMobile"></div>
    </div>
  </div>

    }

    filtered.forEach((r, idx) => {
      const m = Number(r["Margin %"]);
      const el = document.createElement("div");
      el.className = "item" + (idx === selectedIndex ? " active" : "");
      el.innerHTML = `
        <div class="itemLeft">
          <div class="itemName">${escapeHtml(r["Navn"] ?? "")}</div>
          <div class="itemMeta">
            <span class="pill ${marginClass(m)}"><span class="dot"></span><span>${fmtPct(m)}</span></span>
            <span class="pill">Profit: ${formatKr(Number(r["Reel profit"]))}</span>
          </div>
        </div>
        <div class="priceRight">
          ${formatKr(Number(r["Utpris (ink mva)"]))}
          <span class="muted">Utpris</span>
        </div>
      `;
      el.addEventListener("click", () => selectItem(idx));
      listEl.appendChild(el);
    });
  }

  function detailTemplate(r, isMobile) {
    const m = Number(r["Margin %"]);
    const rows = [];

    const fields = [
      ["Innpris", "Innpris", (v)=>formatKr(Number(v))],
      ["Utpris (ink mva)", "Utpris (ink mva)", (v)=>formatKr(Number(v))],
      ["Reel profit", "Fortjeneste", (v)=>formatKr(Number(v))],
      ["Margin %", "Margin", (v)=>fmtPct(Number(v))],
      ["Markup x (Ut/Inn)", "Markup (Ut/Inn)", (v)=>fmtX(Number(v))],
      ["Faktor m/moms ink", "Faktor m/moms ink", (v)=> (v===null||v===undefined||Number.isNaN(Number(v))) ? "–" : Number(v).toFixed(3)],
      ["m/ moms eks", "m/ moms eks", (v)=> (v===null||v===undefined||Number.isNaN(Number(v))) ? "–" : Number(v).toFixed(3)],
    ];

    for (const [key,label,fmt] of fields) {
      if (r[key] !== undefined) rows.push([label, fmt(r[key])]);
    }

    for (const k of Object.keys(r)) {
      if (["Navn", ...fields.map(f=>f[0])].includes(k)) continue;
      const v = r[k];
      if (v === null || v === undefined || v === "") continue;
      rows.push([k, escapeHtml(v)]);
    }

    const rowsHtml = rows.map(([k,v]) => `
      <div class="row">
        <div class="k">${escapeHtml(k)}</div>
        <div class="v">${v}</div>
      </div>
    `).join("");

    const kpisHtml = `
      <div class="kpis">
        <div class="kpi">
          <div class="k">Utpris</div>
          <div class="v">${formatKr(Number(r["Utpris (ink mva)"]))}</div>
        </div>
        <div class="kpi">
          <div class="k">Fortjeneste</div>
          <div class="v">${formatKr(Number(r["Reel profit"]))}</div>
        </div>
        <div class="kpi">
          <div class="k">Margin</div>
          <div class="v"><span class="pill ${marginClass(m)}" style="padding:6px 10px;"><span class="dot"></span><span>${fmtPct(m)}</span></span></div>
        </div>
      </div>
    `;

    const actionsHtml = `
      <div class="actions">
        <button class="btn" onclick="copyOne(${JSON.stringify(String(r["Navn"] ?? ""))})">Kopier som tekst</button>
        <button class="btn" onclick="copyCsvOne(${JSON.stringify(String(r["Navn"] ?? ""))})">Kopier CSV-linje</button>
      </div>
    `;

    const topHtml = `
      <div class="detailTop">
        <div style="min-width:0;">
          <div class="detailName">${escapeHtml(r["Navn"] ?? "")}</div>
          <div class="detailHint">Scroll for mer. På mobil kan du lukke ved å trykke bakgrunnen.</div>
        </div>
        ${isMobile ? "" : `<div class="chip">${filtered.length} treff</div>`}
      </div>
    `;

    return `
      <div class="detail">
        ${topHtml}
        ${kpisHtml}
        <div class="grid2">
          ${rowsHtml}
        </div>
        ${actionsHtml}
      </div>
    `;
  }

  function selectItem(idx) {
    selectedIndex = idx;
    renderList();
    const r = filtered[idx];
    if (!r) return;

    detailDesktop.innerHTML = detailTemplate(r, false);

    if (window.matchMedia("(max-width: 740px)").matches) {
      detailMobile.innerHTML = detailTemplate(r, true);
      openSheet();
    }
  }

  function openSheet() {
    sheet.style.display = "block";
    mobileBackBtn.style.display = "inline-flex";
  }
  function closeSheet() {
    sheet.style.display = "none";
    mobileBackBtn.style.display = "none";
  }

  sheetBackdrop.addEventListener("click", closeSheet);
  mobileBackBtn.addEventListener("click", closeSheet);

  function updateCounts() {
    const text = `${filtered.length} av ${DATA.length} produkter`;
    mobileCount.textContent = text;
    statusChip.textContent = text;
  }

  window.copyOne = async function(name) {
    const r = filtered.find(x => String(x["Navn"]) === name) || DATA.find(x => String(x["Navn"]) === name);
    if (!r) return;
    const lines = [];
    lines.push(String(r["Navn"] ?? ""));
    for (const [k,v] of Object.entries(r)) {
      if (k === "Navn") continue;
      lines.push(`${k}: ${v}`);
    }
    try {
      await navigator.clipboard.writeText(lines.join("\n"));
      toast("Kopiert");
    } catch(e) {
      alert("Kunne ikke kopiere automatisk.");
    }
  }

  window.copyCsvOne = async function(name) {
    const r = filtered.find(x => String(x["Navn"]) === name) || DATA.find(x => String(x["Navn"]) === name);
    if (!r) return;
    const keys = ["Navn","Innpris","Utpris (ink mva)","Reel profit","Margin %","Markup x (Ut/Inn)","Faktor m/moms ink","m/ moms eks"].filter(k => r[k] !== undefined);
    const row = keys.map(k => `"${String(r[k]).replaceAll('"','""')}"`).join(",");
    try {
      await navigator.clipboard.writeText(row);
      toast("CSV kopiert");
    } catch(e) {
      alert("Kunne ikke kopiere automatisk.");
    }
  }

  function toast(msg) {
    const t = document.createElement("div");
    t.textContent = msg;
    t.style.position = "fixed";
    t.style.left = "50%";
    t.style.bottom = "22px";
    t.style.transform = "translateX(-50%)";
    t.style.padding = "10px 12px";
    t.style.borderRadius = "999px";
    t.style.background = "rgba(255,255,255,0.10)";
    t.style.border = "1px solid rgba(255,255,255,0.16)";
    t.style.backdropFilter = "blur(10px)";
    t.style.color = "rgba(255,255,255,0.92)";
    t.style.fontSize = "12px";
    t.style.zIndex = "80";
    document.body.appendChild(t);
    setTimeout(()=>t.remove(), 1100);
  }

  [searchEl, marginFilterEl].forEach(el => {
    el.addEventListener("input", applyFilters);
    el.addEventListener("change", applyFilters);
  });

  applyFilters();

  if (!window.matchMedia("(max-width: 740px)").matches && filtered.length > 0) {
    selectItem(0);
  }

  window.addEventListener("resize", () => {
    if (!window.matchMedia("(max-width: 740px)").matches) {
      closeSheet();
    }
  });
</script>
</body>
</html>
